decision_thresholds:
  auto_accept: 0.85
  review_recommended: 0.65
  manual_review_required: 0.65

alert_thresholds:
  high_priority_confidence: 0.80
  high_priority_min_evidence_signals: 2
  critical_min_evidence_signals: 3

priority_score_ranges:
  P1: [80, 100]
  P2: [60, 79]
  P3: [40, 59]
  P4: [0, 39]

sku_anomaly:
  return_rate_multiplier: 2.5
  z_score_threshold: 3.0
  isolation_forest_contamination: 0.05
