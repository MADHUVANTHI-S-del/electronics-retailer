{% extends "base.html" %}

{% block title %}Return Reason Analyser - Return Insight{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold m-0">Return Reason Analyser</h3>
    <p class="text-muted m-0">Live interactive form + CSV upload for batch root cause classification</p>
  </div>
</div>

<div class="row g-4">
  <!-- Single Analysis Form -->
  <div class="col-md-6">
    <div class="card card-custom">
      <div class="card-header bg-light">
        <h6 class="m-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Analyse Single Return Record</h6>
      </div>
      <div class="card-body">
        <form id="analysisForm" onsubmit="submitSingleAnalysis(event)">
          <div class="mb-3">
            <label class="form-label">Return ID</label>
            <input type="text" name="return_id" class="form-label form-control" value="RET-LIVE-001" required>
          </div>
          <div class="mb-3">
            <label class="form-label">SKU</label>
            <input type="text" name="sku" class="form-control" value="SKU-SMA-1001" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Product Category</label>
            <select name="product_category" class="form-select">
              <option value="Smartphones">Smartphones</option>
              <option value="Laptops">Laptops</option>
              <option value="Headphones">Headphones</option>
              <option value="Chargers">Chargers</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Customer Return Text</label>
            <textarea name="return_text" class="form-control" rows="3" required>battery gets extremely hot and switches off after 10 minutes</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Refund Amount ($)</label>
            <input type="number" step="0.01" name="refund_amount" class="form-control" value="499.99">
          </div>
          <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-wand-magic-sparkles me-1"></i> Run Root Cause Analysis</button>
        </form>
      </div>
    </div>
  </div>

  <!-- CSV Batch Upload Form & Prediction Output View -->
  <div class="col-md-6">
    <div class="card card-custom mb-4">
      <div class="card-header bg-light">
        <h6 class="m-0 fw-bold"><i class="fa-solid fa-file-csv me-2 text-success"></i>CSV Batch Upload</h6>
      </div>
      <div class="card-body">
        <form action="/api/upload" method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Select CSV File</label>
            <input type="file" name="file" class="form-control" accept=".csv" required>
          </div>
          <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-upload me-1"></i> Upload & Process CSV</button>
        </form>
      </div>
    </div>

    <!-- Container for AJAX Single Prediction Output -->
    <div id="analysisResult"></div>
  </div>
</div>
{% endblock %}
